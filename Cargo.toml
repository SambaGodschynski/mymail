[package]
name = "mymail"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
chrono = "0.4"
# HTML to Markdown. A mail body is HTML, and turning that into Markdown well is
# a solved problem — htmd is turndown.js's approach, and keeps this self
# contained where shelling out to pandoc would not.
htmd = "0.5"
